[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studio2ped"
version = "0.2.1"
description = "Convert Pedigree Studio session JSON to PED/MPED pedigree files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
keywords = ["pedigree", "genetics", "ped", "family-tree", "clinical-genetics", "pedigree-studio"]
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
studio2ped = "studio2ped.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/studio2ped"
Issues = "https://github.com/comparativechrono/studio2ped/issues"
Changelog = "https://github.com/comparativechrono/studio2ped/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["studio2ped*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
